version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    ports:
      - '3000:3000'
    environment:
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ESEWA_PRODUCT_CODE=${ESEWA_PRODUCT_CODE}
      - ESEWA_SECRET_KEY=${ESEWA_SECRET_KEY}
      - ESEWA_ENVIRONMENT=${ESEWA_ENVIRONMENT}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_VERIFICATION_CHAT_ID=${TELEGRAM_VERIFICATION_CHAT_ID}
      - TELEGRAM_LISTINGS_CHAT_ID=${TELEGRAM_LISTINGS_CHAT_ID}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - APP_SECRET=${APP_SECRET}
    depends_on:
      - redis
    restart: unless-stopped
    read_only: true          # the app never writes to its own filesystem
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - studentmarket

  redis:
    image: redis:7-alpine
    # No published port: Redis is reachable only by the app on the private docker network, never from the internet
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - studentmarket
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:

networks:
  studentmarket:
    driver: bridge
